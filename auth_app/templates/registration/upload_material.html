{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Material — Illumia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;600;700&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Rajdhani',sans-serif; }
        body { background:#040609; color:#e0e0e0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; }
        .card { background:rgba(10,15,24,0.9); border:1px solid rgba(0,240,255,0.2); border-radius:16px; padding:40px; width:100%; max-width:560px; }
        h1 { font-family:'Orbitron',sans-serif; font-size:18px; color:#00f0ff; letter-spacing:2px; margin-bottom:8px; }
        p { font-size:13px; color:#566c80; margin-bottom:28px; }
        label { display:block; font-size:12px; color:#9cb1c4; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; margin-top:16px; }
        input, textarea, select { width:100%; padding:11px 14px; border-radius:8px; border:1px solid rgba(0,240,255,0.2); background:rgba(0,240,255,0.04); color:#fff; font-size:14px; outline:none; font-family:'Rajdhani',sans-serif; transition:border-color 0.2s; }
        input:focus, textarea:focus { border-color:#00f0ff; }
        textarea { resize:vertical; min-height:80px; }
        input[type="file"] { color:#566c80; cursor:pointer; }
        .btn-row { display:flex; gap:12px; margin-top:28px; }
        .btn { flex:1; padding:12px; border-radius:8px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; transition:all 0.2s; text-decoration:none; text-align:center; border:none; }
        .btn-primary { background:linear-gradient(135deg,#00f0ff,#00b4d8); color:#040609; }
        .btn-outline { background:transparent; border:1px solid rgba(255,255,255,0.1); color:#566c80; }
        .btn-outline:hover { border-color:#00f0ff; color:#00f0ff; }
        .messages { margin-bottom:20px; }
        .message { padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:8px; background:rgba(255,0,127,0.08); border:1px solid rgba(255,0,127,0.2); color:#ff007f; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📤 UPLOAD MATERIAL</h1>
        <p>Upload a course material for your students to purchase and access.</p>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label>Material Title *</label>
            <input type="text" name="title" placeholder="e.g. Introduction to Computer Science — Week 1" required>

            <label>Description</label>
            <textarea name="description" placeholder="Brief description of what this material covers..."></textarea>

            <label>Price (₦) *</label>
            <input type="number" name="price" placeholder="e.g. 500" min="0" step="0.01" required>

            <label>Upload File (PDF) *</label>
            <input type="file" name="file" accept=".pdf,.doc,.docx,.ppt,.pptx" required>

            <div class="btn-row">
                <a href="{% url 'course_materials' %}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Upload Material</button>
            </div>
        </form>
    </div>
</body>
</html>
