{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logout - Illumia</title>
    <style>
        /* ==========================================================================
           1. MASTER CORE DESIGN SYSTEM (CYBER OBSIDIAN & NEON)
           ========================================================================== */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-canvas: #040609;                      
            --glass-bg: rgba(10, 16, 26, 0.65);        
            --glass-bg-hover: rgba(18, 28, 46, 0.85);   
            --cyber-cyan: #00f0ff;
            --cyber-neon-pink: #ff007f;
            --glass-border: rgba(0, 240, 255, 0.15);  
            --text-primary: #ffffff;                   
            --text-secondary: #9cb1c4;                 
            --text-muted: #566c80;                     
            --blur-strength: blur(20px);               
            --spring-physics: cubic-bezier(0.25, 1, 0.5, 1); 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Premium Backlight Glow Overlays */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            z-index: 0;
            filter: blur(140px);                        
            opacity: 0.08;                             
            pointer-events: none;
        }
        body::before {
            background: radial-gradient(circle, var(--cyber-cyan) 0%, transparent 70%); 
            top: -15%;
            left: -10%;
        }
        body::after {
            background: radial-gradient(circle, var(--cyber-neon-pink) 0%, transparent 70%); 
            bottom: -15%;
            right: -10%;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==========================================================================
           2. CENTRALIZED DISCONNECT MATRIX HUB
           ========================================================================== */
        .logout-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 240, 255, 0.05);
            backdrop-filter: var(--blur-strength);
            -webkit-backdrop-filter: var(--blur-strength);
            position: relative;
            z-index: 1;
            animation: slideUp 0.45s var(--spring-physics);
            transition: border-color 0.3s ease;
            text-align: center;
        }

        .logout-container:hover {
            border-color: rgba(255, 0, 127, 0.3);
        }

        /* Tech micro accent (Switched to Pink for Alert Action Context) */
        .logout-container::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 16px;
            height: 16px;
            border-top: 2px solid var(--cyber-neon-pink);
            border-left: 2px solid var(--cyber-neon-pink);
            border-top-left-radius: 8px;
        }

        /* ==========================================================================
           3. INTERFACE GRAPHICS & TYPOGRAPHY
           ========================================================================== */
        .warning-icon {
            font-size: 42px;
            margin-bottom: 18px;
            filter: drop-shadow(0 0 10px rgba(255, 0, 127, 0.3));
            user-select: none;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ==========================================================================
           4. ACTION INTERACTION CONTROLS
           ========================================================================== */
        .button-group {
            display: flex;
            gap: 14px;
            margin-top: 20px;
        }

        .btn {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s var(--spring-physics);
        }

        /* Retain connection node */
        .btn-cancel {
            background: rgba(255, 255, 255, 0.02);
            color: var(--cyber-cyan);
            border: 1px solid var(--glass-border);
        }

        .btn-cancel:hover {
            background: rgba(0, 240, 255, 0.05);
            border-color: var(--cyber-cyan);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-cancel:active {
            transform: translateY(0);
        }

        /* Terminate token pipeline connection */
        .btn-logout {
            background: rgba(255, 0, 127, 0.03);
            border: 1px solid rgba(255, 0, 127, 0.3);
            color: var(--cyber-neon-pink);
        }

        .btn-logout:hover {
            background: var(--cyber-neon-pink);
            color: #ffffff;
            border-color: var(--cyber-neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
            transform: translateY(-1px);
        }

        .btn-logout:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="logout-container">
        <!-- Status Indicator Aura -->
        <div class="warning-icon">🚨</div>
        
        <h2>Sign Out?</h2>
        <p class="message">Are you sure you want to terminate your active workspace connection? You will need to re-verify your credentials to access your local offline storage parameters.</p>

        <!-- Symmetric Action Layout -->
        <div class="button-group">
            <form method="POST" style="flex: 1;">
                {% csrf_token %}
                <button type="submit" class="btn btn-logout">Sign Out</button>
            </form>
            <a href="{% url 'home' %}" class="btn btn-cancel">Cancel</a>
        </div>
    </div>
</body>

</html>
